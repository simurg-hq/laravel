name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pest:
    name: pest (php ${{ matrix.php }}, laravel ${{ matrix.laravel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make composer-update PHP=${{ matrix.php }} LARAVEL=${{ matrix.laravel }}
      - run: make test PHP=${{ matrix.php }}
