name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pint:
    name: pint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make composer-update
      - run: make pint

  larastan:
    # Type differences between Laravel majors surface here, so analyse each.
    name: larastan (laravel ${{ matrix.laravel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make composer-update LARAVEL=${{ matrix.laravel }}
      - run: make larastan
